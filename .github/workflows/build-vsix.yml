name: Build VSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and package extension
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v6
        with:
          name: dslx-vsix
          path: '*.vsix'
          if-no-files-found: error
